name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; trusted publishing needs 11.5.1+
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing: the npm CLI picks up the OIDC token minted by
      # id-token: write above, so there is no NODE_AUTH_TOKEN to supply and
      # provenance is generated automatically without --provenance.
      - name: Publish
        run: npm publish --access public
